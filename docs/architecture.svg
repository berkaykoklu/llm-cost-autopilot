fill="#131a31" stroke="#222b47" stroke-width="1.6"/><text x="524.0" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#e8ecf8">Verifier</text><text x="524.0" y="189" text-anchor="middle" font-size="11.5" fill="#8b95b5">5 samples agree? / Jev</text><path d="M440,175 L460,175" stroke="#8b95b5" stroke-width="1.8" marker-end="url(#a)"/><rect x="620" y="56" width="140" height="50" rx="10" fill="#131a31" stroke="#34c48f" stroke-width="1.6"/><text x="690.0" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#e8ecf8">Serve Luna</text><text x="690.0" y="95" text-anchor="middle" font-size="11.5" fill="#8b95b5">verifier is confident</text><rect x="620" y="244" width="140" height="50" rx="10" fill="#131a31" stroke="#f0a040" stroke-width="1.6"/><text x="690.0" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#e8ecf8">Ask Sol</text><text x="690.0" y="283" text-anchor="middle" font-size="11.5" fill="#8b95b5">reasoning, ~20× price</text><path d="M586,164 C640,140 690,140 690,110" fill="none" stroke="#34c48f" stroke-width="2.6" marker-end="url(#c)"/><path d="M586,186 C640,210 690,210 690,240" fill="none" stroke="#f0a040" stroke-width="2.6" marker-end="url(#e)"/><text x="24" y="66" font-size="12.5" fill="#8b95b5"><tspan fill="#34c48f">■</tspan> consistency: 67.3% at 36% lower cost</text><text x="24" y="86" font-size="12.5" fill="#8b95b5"><tspan fill="#b186ff">■</tspan> Jev verifier: 68.0% at 22% lower cost</text><text x="24" y="106" font-size="12.5" fill="#8b95b5">all Sol: 70.0%</text><text x="24" y="306" font-size="11.5" fill="#8b95b5">every request is logged with its cost and what all-Sol would have cost</text></svg>